[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lobforge-research"
version = "0.4.0rc1"
description = "Deterministic LOBForge research data and leakage-safe signal validation"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pyarrow>=16,<24",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.scripts]
lobforge-research = "lobforge_research.cli:main"

[dependency-groups]
dev = [
  "hatchling==1.27.0",
  "hypothesis>=6.100,<7",
  "mypy>=1.10,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff==0.15.6",
]

[tool.uv]
build-constraint-dependencies = ["hatchling==1.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lobforge_research"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["lobforge_research"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["lobforge_research"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "matplotlib.*", "pyarrow.*"]
ignore_missing_imports = true
